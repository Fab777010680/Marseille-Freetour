<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marseille Freetour</title>
  <style>
    @media screen and (max-width: 768px) {
      .section {
        flex-direction: column;
        text-align: center;
      }
      .section img {
        width: 90% !important;
        max-width: 100% !important;
      }
      .text {
        padding: 10px;
      }
      .info {
        padding: 20px 15px;
        font-size: 16px !important;
      }
      iframe {
        height: 200px !important;
      }
    }
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: #ffffff;
      height: 100%;
      overflow-x: hidden;
      background: url('https://i.postimg.cc/Y9HPM7Y7/Chat-GPT-Image-11-avr-2025-12-40-21.png') no-repeat center center scroll;
      background-size: 100% auto;
      background-attachment: scroll;
    }
    .content {
      max-width: 850px;
      margin: 4cm auto;
      padding-top: 4cm;
      padding: 20px;
      background-color: transparent;
      border-radius: 12px;
    }
    .section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .section img {
      width: 100%;
      max-width: 250px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      margin: 15px;
    }
    .tour-images {
      display: flex;
      flex-direction: column;
      gap: 1cm;
    }
    .text {
      flex: 1;
      padding: 20px;
      text-align: left;
      min-width: 300px;
      color: #fff;
      text-shadow: 3px 3px 6px #000;
    }
    h2 {
      font-size: 30px;
      margin-bottom: 20px;
      color: #fff;
      text-shadow: 3px 3px 6px #000;
    }
    p {
      font-size: 22px;
      font-weight: normal;
      line-height: 1.8;
      text-shadow: 3px 3px 6px #000;
    }
    .info {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      font-size: 22px;
      line-height: 1.8;
      color: #fff;
      margin: 40px 0;
    }
    .whatsapp-button {
      margin: 20px auto;
      padding: 15px 30px;
      background-color: #25D366;
      color: white;
      font-size: 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    iframe {
      width: 100%;
      height: 250px;
      border-radius: 8px;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <!-- ... contenu repris du canvas ... -->
</body>
</html>
